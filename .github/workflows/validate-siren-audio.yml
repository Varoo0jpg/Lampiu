name: Validate Lampiu Siren Audio Code

on:
  push:
    branches:
      - feat/siren-audio-panel-sync
    paths:
      - "Coba/siren_audio.py"
      - "Coba/Coba_kamera.py"
      - ".github/workflows/validate-siren-audio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python modules
        run: |
          python -m py_compile Coba/siren_audio.py Coba/Coba_kamera.py

      - name: Check declared audio dependencies
        run: |
          test -s requirements-audio.txt
          grep -q "tensorflow-hub" requirements-audio.txt
          grep -q "yt-dlp" requirements-audio.txt
