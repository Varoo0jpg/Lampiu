name: Train Lampiu Emergency Vehicle YOLO

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training epochs"
        required: true
        default: "50"
        type: string
      imgsz:
        description: "Image size"
        required: true
        default: "640"
        type: string
      batch:
        description: "Batch size for CPU runner"
        required: true
        default: "8"
        type: string

permissions:
  contents: read

jobs:
  train:
    name: Train and evaluate emergency detector
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ultralytics

      - name: Train YOLO on emergency dataset
        run: |
          python train_emergency_yolo.py \
            --epochs "${{ inputs.epochs }}" \
            --imgsz "${{ inputs.imgsz }}" \
            --batch "${{ inputs.batch }}" \
            --workers 2 \
            --device cpu

      - name: Upload trained weights, metrics, and plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lampiu-yolo26n-emergency
          if-no-files-found: warn
          path: |
            Coba/yolo26n_emergency_best.pt
            Coba/emergency_training_metrics.json
            Coba/runs_emergency/lampiu_emergency_yolo26n/results.csv
            Coba/runs_emergency/lampiu_emergency_yolo26n/results.png
            Coba/runs_emergency/lampiu_emergency_yolo26n/confusion_matrix.png
            Coba/runs_emergency/lampiu_emergency_yolo26n/weights/best.pt
            Coba/runs_emergency/lampiu_emergency_yolo26n/weights/last.pt
            Coba/runs_emergency/test_evaluation/**
